<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2430;--mut:#6b7380;--line:#e3e6eb;--acc:#1f4e79;

*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--acc);color:#fff;padding:18px 16px}
header h1{margin:0;font-size:20px}
header p{margin:4px 0 0;opacity:.85;font-size:13px}
nav{display:flex;gap:4px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;padding:12px 14px;font-size:14px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--acc);border-color:var(--acc);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 6px;font-size:16px}
.mut{color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}
.kpi .l{font-size:12px;color:var(--mut)}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px}
.kpi .s{font-size:12px;color:var(--mut)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:13px}
th{font-size:12px;color:var(--mut);font-weight:600;background:#fafbfc}
td:first-child,th:first-child{text-align:left;font-weight:600;position:sticky;left:0;background:#fff}
.c{display:inline-block;min-width:58px;padding:4px 6px;border-radius:6px;font-weight:600}
.G{background:var(--gb);color:var(--g)}.A{background:var(--ab);color:var(--a)}.R{background:var(--rb);color:var(--r)}.N{background:var(--n);color:var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:10px}
.bar{display:grid;grid-template-columns:110px 1fr 90px;align-items:center;gap:8px;margin:5px 0}
.track{position:relative;height:16px;background:var(--n);border-radius:4px}
.fill{height:100%;border-radius:4px}
.tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.lect{background:#f3f6fa;border-left:3px solid var(--acc);padding:8px 10px;border-radius:4px;margin:6px 0 12px;line-height:1.45}
select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:#fff}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.box h3{margin:0 0 4px;font-size:13px}
.box p{margin:0;line-height:1.45}
.ok{border-left:4px solid var(--g)}.ko{border-left:4px solid var(--r)}.ac{border-left:4px solid var(--acc)}.av{border-left:4px solid var(--a)}
.box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}
.up{color:var(--g)}.dn{color:var(--r)}
svg text{font-size:11px;fill:var(--mut)}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px}
</style>

liza todo: +3 graduaciones y +1.323 € el lunes. 53 graduaciones (2ª de la red) y 68% del objetivo, en ritmo.", "flojea": "Mezcla de progresivo 19%, de las más bajas de la red (24% en el año frente al 40%); progresivo con ADD 23% (8 de 35), 11 ADD sin compra (+2 el lunes); conversión baja al 66%; 0 presupuestos.", "accion": "Formación de progresivo y llamar a los 11 ADD sin compra; dar presupuesto a quien no compre.", "aviso": "Columnas >60 años y Acepta revisión vacías en las 59 filas de octubre: el KPI de audio no se puede medir."}], "lecturas": [{"kpi": "facturacion", "texto": "La red lleva 199.129 € = 71% del objetivo de octubre (281.000 €) con el 58% de días laborables: proyección 345.000 €. Solo +1.803 € desde la última actualización porque 9 de 11 tiendas no han cargado el lunes (solo Zizur +1.323 € y Mendebaldea +480 €). 9 de 11 en ritmo; Tolosa (27%) y Vitoria (36%) muy por detrás. Andoain (104%) y Beraun (113%) ya cumplen el mes. Acumulado ene-sep 103%."}, {"kpi": "conversion", "texto": "Red 75% (202 ventas de 270 graduados), por encima del 70%. Sangüesa 100%, Biteri 90%, Hernani 85%. Por debajo: Andoain 41%, Mendebaldea 53% y Zizur 66% (baja desde el 68%)."}, {"kpi": "progresivos", "texto": "Progresivo con ADD en la red 28% (56 de 202), frente al 37-41% de los meses anteriores y lejos del 60%. 48 clientes con ADD sin compra (13 en Irún, 11 en Zizur, 7 en Andoain). Biteri 16% y Andoain 15%, los más bajos."}, {"kpi": "mezcla", "texto": "Mezcla de progresivo en octubre 28% (64 de 226 lentes) frente al 40% de septiembre; Tolosa 17%, Biteri 19% y Zizur 19% las más bajas. Acumulado del año entre 24% (Zizur) y 67% (Beraun)."}, {"kpi": "gamas", "texto": "64 progresivos en octubre: Premium 27, Individual 14, Advanced 12, Standard 6, VisuPro 4 (1 sin gama). Premium sigue dominando (42%); Sangüesa (9) y Biteri (6) concentran Premium. El único progresivo nuevo (Zizur) fue Individual."}, {"kpi": "duo", "texto": "DUO de la red 10% (20 de 202 ventas), frente al 19% de septiembre y 24-28% de abril a agosto. Ninguno nuevo desde la última actualización. En objetivo: Beraun 50% y Mendebaldea 25%. A cero: Andoain, Hondarribia, Irún y Tolosa."}, {"kpi": "refuerzo_sin", "texto": "Refuerzo en clientes sin ADD: 12 de 68 en la red (11 de 135 en septiembre). Sangüesa 3 de 8, Tolosa 2 de 4, Zizur 2 de 18. No lo proponen: Beraun, Biteri (0 de 6) y Vitoria."}, {"kpi": "refuerzo_con", "texto": "Refuerzo en clientes con ADD: 9 de 202 (18 de 316 en septiembre). Andoain 3 de 13, Irún 2 de 46. Sin ninguno: Beraun, Hondarribia, Tolosa, Vitoria y Zizur."}, {"kpi": "audio", "texto": "Revisión auditiva: 9 de 74 mayores de 60 (12%), por debajo del 25%. Irún 5 de 28; Biteri 0 de 12 y Hondarribia 0 de 9. Zizur no rellena la columna (59 filas vacías) y Hernani/Andoain casi no."}, {"kpi": "presupuestos", "texto": "9 presupuestos dados en octubre y ninguno aceptado todavía; sin cambios. Seguimiento en Biteri (2) e Irún (2); Zizur, con 18 graduados sin compra, no ha dado ninguno."}, {"kpi": "evolucion", "texto": "Tendencia mes a mes de la red: facturación del 94% en febrero-marzo al 113% en agosto y 118% en septiembre; octubre al 71% con el 58% del mes, en camino de superarlo. La conversión se mantiene en 71-83% (75% en octubre). Lo que empeora: progresivo con ADD baja del 41% (julio) al 37% (septiembre) y 28% en octubre; DUO del 28% (mayo) al 19% (septiembre) y 10% en octubre; mezcla del 40% al 28%."}], "corte": {"semana": "Lunes 19 de octubre", "fecha_corte": "2026-10-20", "dias_transcurridos": "15", "dias_mes": "26", "edicion": "3", "mes_nombre": "Octubre", "acum_nombre": "Enero–Septiembre", "mes_n": "10"}};
const C=D.corte, ritmo=(+C.dias_transcurridos)/(+C.dias_mes);
const num=v=>v===''||v==null?null:+v;
const pct=v=>v==null?'—':Math.round(v*100)+'%';
const eur=v=>v==null?'—':Math.round(v).toLocaleString('es-ES')+' €';
const T=D.tiendas, A={};D.anterior.forEach(r=>A[r.tienda]=r);
const F={};D.fichas.forEach(r=>F[r.tienda]=r);
const L={};D.lecturas.forEach(r=>L[r.kpi]=r.texto);
document.getElementById('sub').textContent=`Edición ${C.edicion} · Datos: ${C.semana} · ${C.mes_nombre}: ${C.dias_transcurridos} de ${C.dias_mes} días laborables (${pct(ritmo)} del mes)`;
document.getElementById('foot').textContent=`Actualizado el ${C.fecha_corte.split('-').reverse().join('/')} · Copia de solo lectura del panel de operaciones`;
// KPI definitions: key, label, target, amber band, kind
const K=[
 {k:'pct_mes',l:'Facturación mes',t:()=>ritmo,b:.10,f:pct,lec:'facturacion',sub:r=>eur(num(r.fact_mes))+' de '+eur(num(r.obj_mes))},
 {k:'pct_acum',l:'Acumulado '+C.acum_nombre,t:()=>1,b:.05,f:pct,sub:r=>eur(num(r.fact_acum))},
 {k:'conv_venta',l:'Conversión venta',t:()=>.70,b:.10,f:pct,lec:'conversion',sub:r=>r.ventas_principales+' de '+r.graduaciones},
 {k:'conv_prog',l:'Progresivo con ADD',t:()=>.60,b:.10,f:pct,lec:'progresivos',sub:r=>r.prog_add+' de '+r.clientes_add},
 {k:'prog_ytd',l:'Mezcla progresivo (año)',t:()=>.40,b:.05,f:pct,lec:'mezcla'},
 {k:'duo_pct',l:'DUO (2ª unidad)',t:()=>.25,b:.10,f:pct,lec:'duo',sub:r=>r.duo+' de '+r.ventas_principales},
 {k:'deriv_audio',l:'Revisión auditiva +60',t:()=>.25,b:.10,f:pct,lec:'audio',sub:r=>r.aceptan_audio+' de '+r.mayores60},
];
const color=(v,kp)=>{if(v==null)return'N';const t=kp.t();return v>=t-1e-9?'G':v>=t-kp.b-1e-9?'A':'R'};
const COL={G:'var(--g)',A:'var(--a)',R:'var(--r)',N:'#aab'};
const delta=(r,k)=>{const a=A[r.tienda];if(!a)return'';const x=num(r[k]),y=num(a[k]);if(x==null||y==null)return'';const d=Math.round((x-y)*100);return d===0?'':`<div class="${d>0?'up':'dn'}" style="font-size:11px">${d>0?'▲':'▼'} ${Math.abs(d)} pts</div>`};
function sum(rs,k){return rs.reduce((s,r)=>s+(+r[k]||0),0)}
function red(){const g=sum(T,'graduaciones'),vp=sum(T,'ventas_principales'),f=sum(T,'fact_mes'),o=sum(T,'obj_mes');
 return `<div class="kpis">
 <div class="kpi"><div class="l">Facturación red</div><div class="v">${pct(f/o)}</div><div class="s">${eur(f)} de ${eur(o)} · ritmo ${pct(ritmo)}</div></div>
 <div class="kpi"><div class="l">Proyección del mes</div><div class="v">${eur(f/ritmo)}</div><div class="s">objetivo ${eur(o)}</div></div>
 <div class="kpi"><div class="l">Conversión red</div><div class="v">${pct(vp/g)}</div><div class="s">${vp} ventas de ${g} graduados · obj. 70%</div></div>
 <div class="kpi"><div class="l">Progresivo con ADD</div><div class="v">${pct(sum(T,'prog_add')/sum(T,'clientes_add'))}</div><div class="s">obj. 60%</div></div>
 <div class="kpi"><div class="l">DUO red</div><div class="v">${pct(sum(T,'duo')/vp)}</div><div class="s">obj. 25%</div></div>
 <div class="kpi"><div class="l">Acumulado año</div><div class="v">${pct(sum(T,'fact_acum')/sum(T,'obj_acum'))}</div><div class="s">${C.acum_nombre}</div></div></div>`}
const V={
semaforo(){let h=`<div class="card"><h2>Resumen de la red</h2>${red()}</div><div class="card"><h2>Semáforo por tienda</h2><p class="mut">Verde: en objetivo · Ámbar: cerca · Rojo: lejos. La facturación se compara con el ritmo del mes (${pct(ritmo)}). Flechas: cambio desde la actualización anterior.</p><div class="wrap"><table><tr><th>Tienda</th>${K.map(k=>`<th>${k.l}</th>`).join('')}<th>Refuerzo sin ADD</th><th>Refuerzo con ADD</th></tr>`;
 T.forEach(r=>{h+=`<tr><td>${r.tienda}</td>${K.map(k=>{const v=num(r[k.k]);return`<td><span class="c ${color(v,k)}">${pct(v)}</span>${delta(r,k.k)}</td>`}).join('')}<td>${r.ref_sin_add} de ${r.clientes_sin_add}</td><td>${r.ref_con_add} de ${r.clientes_add}</td></tr>`});
 return h+`</table></div><div class="legend"><span><span class="c G">verde</span> en objetivo</span><span><span class="c A">ámbar</span> cerca</span><span><span class="c R">rojo</span> lejos</span></div></div>`},
punto(){let h='';K.forEach(k=>{const t=k.t();const rs=[...T].sort((a,b)=>(num(b[k.k])??-1)-(num(a[k.k])??-1));const mx=Math.max(1.2,...rs.map(r=>num(r[k.k])||0));
 h+=`<div class="card"><h2>${k.l}</h2>${k.lec&&L[k.lec]?`<div class="lect">${L[k.lec]}</div>`:''}<p class="mut" style="margin:0 0 6px">Línea negra: objetivo ${pct(t)}</p>`;
 rs.forEach(r=>{const v=num(r[k.k]);const c=color(v,k);h+=`<div class="bar"><div>${r.tienda}</div><div class="track"><div class="fill" style="width:${(v||0)/mx*100}%;background:${COL[c]}"></div><div class="tgt" style="left:${t/mx*100}%"></div></div><div><b>${pct(v)}</b> <span class="mut" style="font-size:11px">${k.sub?k.sub(r):''}</span></div></div>`});h+='</div>'});
 ['gamas','refuerzo_sin','refuerzo_con','presupuestos','evolucion'].forEach(x=>{if(L[x])h+=`<div class="card"><h2>${{gamas:'Gamas de progresivo',refuerzo_sin:'Refuerzo sin ADD',refuerzo_con:'Refuerzo con ADD',presupuestos:'Presupuestos',evolucion:'Tendencia de la red'}[x]}</h2><div class="lect">${L[x]}</div></div>`});return h},
ficha(sel){sel=sel||T[0].tienda;const r=T.find(x=>x.tienda===sel),f=F[sel]||{};
 let h=`<div class="card"><label>Tienda: <select onchange="go('ficha',this.value)">${T.map(x=>`<option${x.tienda===sel?' selected':''}>${x.tienda}</option>`).join('')}</select></label></div>`;
 h+=`<div class="card"><h2>${sel} · ${r.periodo}</h2><div class="kpis">${K.map(k=>{const v=num(r[k.k]);return`<div class="kpi"><div class="l">${k.l}</div><div class="v" style="color:${COL[color(v,k)]}">${pct(v)}</div><div class="s">${k.sub?k.sub(r):''} · obj. ${pct(k.t())}</div>${delta(r,k.k)}</div>`}).join('')}
 <div class="kpi"><div class="l">Proyección mes</div><div class="v">${eur(num(r.proy_mes))}</div><div class="s">objetivo ${eur(num(r.obj_mes))}</div></div>
 <div class="kpi"><div class="l">Graduaciones / ventas</div><div class="v">${r.graduaciones} / ${r.ventas_total}</div><div class="s">${r.duo} DUO · ${r.add_sin_compra} ADD sin compra</div></div></div></div>`;
 h+=`<div class="grid2"><div class="box ok"><h3>Lo bueno</h3><p>${f.lo_bueno||'—'}</p></div><div class="box ko"><h3>Flojea</h3><p>${f.flojea||'—'}</p></div><div class="box ac"><h3>Acción</h3><p>${f.accion||'—'}</p></div>${f.aviso?`<div class="box av"><h3>Aviso sobre los datos</h3><p>${f.aviso}</p></div>`:''}</div>`;return h},
evol(sel,kk){sel=sel||'Red';kk=kk||'conv_venta';const EK={conv_venta:['Conversión venta',.7],conv_prog:['Progresivo con ADD',.6],mezcla_prog:['Mezcla progresivo',.4],duo_pct:['DUO',.25],pct_fact:['Facturación vs objetivo',1]};
 const M=D.mensual,ms=[...new Set(M.map(r=>+r.mes_n))].sort((a,b)=>a-b);
 const val=(rs,k)=>{const s=x=>sum(rs,x);if(k==='conv_venta')return s('graduaciones')?s('ventas_principales')/s('graduaciones'):null;if(k==='conv_prog')return s('clientes_add')?s('prog_add')/s('clientes_add'):null;if(k==='mezcla_prog')return s('lentes')?s('progresivos')/s('lentes'):null;if(k==='duo_pct')return s('ventas_principales')?s('duo')/s('ventas_principales'):null;if(k==='pct_fact')return s('obj')?s('fact')/s('obj'):null};
 const pts=ms.map(m=>{const rs=M.filter(r=>+r.mes_n===m&&(sel==='Red'||r.tienda===sel));return{m,v:val(rs,kk),n:rs[0]?rs[0].mes:''}});
 const W=760,H=260,p=36,mx=Math.max(EK[kk][1]*1.2,...pts.map(x=>x.v||0)),X=i=>p+i*(W-2*p)/Math.max(1,pts.length-1),Y=v=>H-p-(v/mx)*(H-2*p);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;[0,.25,.5,.75,1].forEach(g=>{const v=g*mx;s+=`<line x1="${p}" x2="${W-p}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e3e6eb"/><text x="4" y="${Y(v)+4}">${pct(v)}</text>`});
 s+=`<line x1="${p}" x2="${W-p}" y1="${Y(EK[kk][1])}" y2="${Y(EK[kk][1])}" stroke="#1d2430" stroke-dasharray="5 4"/><text x="${p+4}" y="${Y(EK[kk][1])+14}">objetivo ${pct(EK[kk][1])}</text>`;
 const ok=pts.filter(x=>x.v!=null);s+=`<polyline fill="none" stroke="#1f4e79" stroke-width="2.5" points="${pts.map((x,i)=>x.v==null?'':X(i)+','+Y(x.v)).join(' ')}"/>`;
 pts.forEach((x,i)=>{s+=`<text x="${X(i)-10}" y="${H-12}">${x.n.slice(0,3)}</text>`;if(x.v!=null)s+=`<circle cx="${X(i)}" cy="${Y(x.v)}" r="4" fill="#1f4e79"><title>${x.n}: ${pct(x.v)}</title></circle><text x="${X(i)-12}" y="${Y(x.v)-9}" style="fill:#1d2430">${pct(x.v)}</text>`});s+='</svg>';
 return `<div class="card"><label>Ver: <select onchange="go('evol',this.value,'${kk}')"><option>Red</option>${T.map(x=>`<option${x.tienda===sel?' selected':''}>${x.tienda}</option>`).join('')}</select></label> &nbsp; <label>Indicador: <select onchange="go('evol','${sel}',this.value)">${Object.entries(EK).map(([k,v])=>`<option value="${k}"${k===kk?' selected':''}>${v[0]}</option>`).join('')}</select></label></div>
 <div class="card"><h2>${EK[kk][0]} · ${sel} · mes a mes</h2><p class="mut">${C.mes_nombre} está en curso (${C.dias_transcurridos} de ${C.dias_mes} días).</p>${s}</div>${L.evolucion?`<div class="card"><h2>Tendencia de la red</h2><div class="lect">${L.evolucion}</div></div>`:''}`}
};
const TABS=[['semaforo','Semáforo'],['punto','Punto a punto'],['ficha','Ficha por tienda'],['evol','Evolución mes a mes']];
function go(t,...a){document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button class="${k===t?'on':''}" onclick="go('${k}')">${l}</button>`).join('');document.getElementById('app').innerHTML=V[t](...a);}
go('semaforo');
</script>
</body>
</html>
